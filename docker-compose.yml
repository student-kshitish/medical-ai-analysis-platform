services:

  db:
    image: postgres:16
    container_name: medical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-medical_ai_db}
      POSTGRES_USER: ${DB_USER:-medical_ai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in project .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medical_ai_user} -d ${DB_NAME:-medical_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: medical-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
    environment:
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:?Set ORTHANC_PASSWORD in project .env}
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medical-ai-backend
    restart: unless-stopped
    runtime: nvidia
    gpus: all
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      orthanc:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./AIML-02/storage:/app/AIML-02/storage
      - ./artifacts:/app/artifacts
      - ./AIML-01/data/dicom:/app/AIML-01/data/dicom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./AIML-02/frontend
      dockerfile: Dockerfile
    container_name: medical-ai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  orthanc_data:
    external: true
    name: orthanc-storage
